name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sgjio
          POSTGRES_PASSWORD: sgjio
          POSTGRES_DB: sgjio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sgjio"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sgjio:sgjio@localhost:5432/sgjio_test
      DATABASE_URL: postgresql+psycopg://sgjio:sgjio@localhost:5432/sgjio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Models and migrations match
        run: alembic upgrade head && alembic check
      - run: pytest

  web:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
