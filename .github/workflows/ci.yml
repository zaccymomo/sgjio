name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job runs the same commands a developer runs locally (CONTRIBUTING.md). Python is
# 3.11 in a per-folder .venv made by uv, as on our machines.
jobs:
  # One job per Python service: lint, format, migrations match the models, tests. Each gets
  # its own Postgres, plus the RabbitMQ and Mailpit its broker and email tests talk to (they
  # skip without them locally; here they run).
  service:
    name: Service (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity, content, learning, notification]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sgjio
          POSTGRES_PASSWORD: sgjio
          POSTGRES_DB: service_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sgjio -d service_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.4.0-management
        env:
          RABBITMQ_DEFAULT_USER: sgjio
          RABBITMQ_DEFAULT_PASS: sgjio
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 10s
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: ["1025:1025", "8025:8025"]
    env:
      # One database for both: pytest rebuilds it from the migrations anyway.
      DATABASE_URL: postgresql+psycopg://sgjio:sgjio@localhost:5432/service_test
      TEST_DATABASE_URL: postgresql+psycopg://sgjio:sgjio@localhost:5432/service_test
      BROKER_URL: amqp://sgjio:sgjio@localhost:5672/%2F
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/requirements*.txt
      - name: Install (Python 3.11 in .venv)
        run: |
          uv venv -p 3.11 .venv
          uv pip install -p .venv/bin/python -r requirements-dev.txt
      - run: .venv/bin/python -m ruff check .
      - run: .venv/bin/python -m ruff format --check .
      - name: Models and migrations match
        run: .venv/bin/python -m alembic upgrade head && .venv/bin/python -m alembic check
      - run: .venv/bin/python -m pytest -rs

  # The plumbing each service copies (templates/platform): its own tests, and every copy
  # still identical to it.
  platform:
    name: Platform template
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sgjio
          POSTGRES_PASSWORD: sgjio
          POSTGRES_DB: sgjio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sgjio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.4.0-management
        env:
          RABBITMQ_DEFAULT_USER: sgjio
          RABBITMQ_DEFAULT_PASS: sgjio
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 10s
    env:
      PLATFORM_TEST_DATABASE_URL: postgresql+psycopg://sgjio:sgjio@localhost:5432/platform_test
      PLATFORM_TEST_BROKER_URL: amqp://sgjio:sgjio@localhost:5672/%2F
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: templates/platform/requirements.txt
      - name: Install (Python 3.11 in .venv)
        working-directory: templates/platform
        run: |
          uv venv -p 3.11 .venv
          uv pip install -p .venv/bin/python -r requirements.txt
      - name: Lint, format and tests
        working-directory: templates/platform
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m pytest -rs
      - name: Every service's app/platform is an unchanged copy
        run: |
          for service in identity content learning notification; do
            diff -r -x __pycache__ templates/platform/app/platform "services/$service/app/platform"
          done

  contracts:
    name: Event contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: contracts/requirements.txt
      - name: Install (Python 3.11 in .venv)
        run: |
          uv venv -p 3.11 contracts/.venv
          uv pip install -p contracts/.venv/bin/python -r contracts/requirements.txt
      - name: Schemas, examples and negative cases
        run: contracts/.venv/bin/python contracts/validate.py

  # Builds the nginx image and checks every route against stub services (docker on the runner).
  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: services/gateway/tests/run.sh

  web:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  # The whole stack in Docker, seeded, and the e2e suite through the gateway. The resilience
  # drills (which stop containers) stay opt-in: scripts/e2e.sh --resilience.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: e2e/requirements.txt
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Seed (with demo learners for lesson insights)
        run: scripts/seed-all.sh --demo
      - name: Install (Python 3.11 in e2e/.venv)
        run: |
          uv venv -p 3.11 e2e/.venv
          uv pip install -p e2e/.venv/bin/python -r e2e/requirements.txt
      - name: End-to-end suite
        working-directory: e2e
        run: .venv/bin/python -m pytest -m "not resilience" -rs
      - name: Container state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Stop the stack
        if: always()
        run: docker compose down -v
