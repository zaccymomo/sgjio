# Local services for development: the database and a test email inbox.
# Start with:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sgjio
      POSTGRES_PASSWORD: sgjio
      POSTGRES_DB: sgjio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgjio"]
      interval: 5s
      retries: 10

  # Catches every email the app sends. Open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox

volumes:
  pgdata:
