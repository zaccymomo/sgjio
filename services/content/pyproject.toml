# Tool configuration for the Content service (copied from the monolith's api/pyproject.toml on main).
# Dependencies live in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI's Depends() in default arguments is the intended pattern.
ignore = ["B008"]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the import means the library.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient notice about a future httpx rename; harmless for now.
    "ignore:Using `httpx` with `starlette.testclient`",
]
